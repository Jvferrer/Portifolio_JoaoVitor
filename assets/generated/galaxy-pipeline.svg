<svg xmlns="http://www.w3.org/2000/svg" width="850" height="360" viewBox="0 0 850 360" role="img">
  <title>Galaxy QA Pipeline</title>
  <desc>Pipeline de qualidade: Commit, Pull Request, CI com Build e Lint, testes de API e E2E, Quality Gate, Deploy quando passa e Feedback quando falha.</desc>
  <defs>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="fail-arm" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="nebula-gate" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#00d4ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-deploy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-violet" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#a78bfa" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.75" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-green" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#34d399" flood-opacity="0.75" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-rose" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" in="SourceGraphic" result="blur"/>
      <feFlood flood-color="#fb7185" flood-opacity="0.75" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="haze" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <style>
      .hud { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { font-family: ui-sans-serif, Segoe UI, sans-serif; font-weight: 650; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="849" height="359" rx="12" fill="#0f1623" stroke="#1a2332"/>

  <g opacity="0.35">
    <polyline points="8,24 8,8 24,8" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="826,8 842,8 842,24" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="8,336 8,352 24,352" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <polyline points="826,352 842,352 842,336" fill="none" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <text class="hud" x="32" y="36" fill="#e2e8f0" font-size="12" letter-spacing="2.4">GALAXY QA PIPELINE</text>
  <circle cx="228" cy="32" r="3" fill="#00d4ff">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text class="hud" x="818" y="36" fill="#64748b" font-size="10" text-anchor="end" letter-spacing="1.6">CONTINUOUS TESTING</text>

  <g fill="#94a3b8">
    <circle cx="48" cy="68" r="0.7" opacity="0.35"><animate attributeName="opacity" values="0.15;0.7;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="250" r="0.8" fill="#a78bfa" opacity="0.3"><animate attributeName="opacity" values="0.12;0.6;0.12" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="300" r="0.5" opacity="0.4"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="6.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="64" r="0.9" fill="#00d4ff" opacity="0.25"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="48" r="0.6" opacity="0.3"><animate attributeName="opacity" values="0.12;0.5;0.12" dur="7.2s" repeatCount="indefinite"/></circle>
    <circle cx="510" cy="70" r="0.8" fill="#a78bfa" opacity="0.28"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="52" r="0.5" opacity="0.35"><animate attributeName="opacity" values="0.15;0.65;0.15" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="78" r="1" fill="#34d399" opacity="0.25"><animate attributeName="opacity" values="0.12;0.55;0.12" dur="6.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="250" r="0.7" opacity="0.3"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="310" r="0.6" fill="#fb7185" opacity="0.25"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.9s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="330" r="0.8" opacity="0.22"><animate attributeName="opacity" values="0.08;0.4;0.08" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="320" r="0.5" fill="#00d4ff" opacity="0.3"><animate attributeName="opacity" values="0.12;0.55;0.12" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <ellipse cx="590" cy="175" rx="90" ry="54" fill="url(#nebula-gate)" filter="url(#haze)" opacity="0.9"/>
  <ellipse cx="730" cy="115" rx="70" ry="42" fill="url(#nebula-deploy)" filter="url(#haze)" opacity="0.85"/>

  <path id="main-flow" d="M90 175 C150 175 150 115 210 115 C270 115 270 175 330 175 C395 175 395 115 460 115 C530 115 530 175 590 175 C655 175 670 115 730 115" fill="none" stroke="url(#arm)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M572 188 C500 210 470 255 460 280 C300 312 170 248 108 198" fill="none" stroke="url(#fail-arm)" stroke-width="1.6" stroke-dasharray="5 6" stroke-linecap="round" opacity="0.9"/>

  <circle r="3.2" fill="#ffffff">
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto">
      <mpath href="#main-flow"/>
    </animateMotion>
  </circle>

  <g>
    <circle cx="90" cy="175" r="18" fill="none" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0 90 175" to="360 90 175" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="175" r="8" fill="#a78bfa" opacity="0.2" filter="url(#glow-violet)"/>
    <circle cx="90" cy="175" r="5.5" fill="#a78bfa"/>
    <circle cx="90" cy="175" r="2" fill="#ffffff"/>
    <text class="label" x="90" y="210" fill="#f1f5f9" font-size="13" text-anchor="middle">Commit</text>
    <text class="hud" x="90" y="226" fill="#94a3b8" font-size="9" text-anchor="middle">01</text>
  </g>

  <g>
    <circle cx="210" cy="115" r="18" fill="none" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0 210 115" to="360 210 115" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="115" r="8" fill="#a78bfa" opacity="0.2" filter="url(#glow-violet)"/>
    <circle cx="210" cy="115" r="5.5" fill="#a78bfa"/>
    <circle cx="210" cy="115" r="2" fill="#ffffff"/>
    <text class="label" x="210" y="86" fill="#f1f5f9" font-size="13" text-anchor="middle">Pull Request</text>
    <text class="hud" x="210" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">02</text>
  </g>

  <g>
    <circle cx="330" cy="175" r="18" fill="none" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0 330 175" to="360 330 175" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="175" r="8" fill="#a78bfa" opacity="0.2" filter="url(#glow-violet)"/>
    <circle cx="330" cy="175" r="5.5" fill="#a78bfa"/>
    <circle cx="330" cy="175" r="2" fill="#ffffff"/>
    <text class="label" x="330" y="210" fill="#f1f5f9" font-size="13" text-anchor="middle">CI Pipeline</text>
    <text class="hud" x="330" y="226" fill="#a78bfa" font-size="9" text-anchor="middle">BUILD � LINT</text>
  </g>

  <g>
    <circle cx="460" cy="115" r="18" fill="none" stroke="#00d4ff" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 460 115" to="360 460 115" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="115" r="8" fill="#00d4ff" opacity="0.22" filter="url(#glow-cyan)"/>
    <circle cx="460" cy="115" r="5.5" fill="#00d4ff"/>
    <circle cx="460" cy="115" r="2" fill="#ffffff"/>
    <text class="label" x="460" y="86" fill="#f1f5f9" font-size="13" text-anchor="middle">API � E2E</text>
    <text class="hud" x="460" y="72" fill="#00d4ff" font-size="9" text-anchor="middle">AUTOMATED TESTS</text>
  </g>

  <g>
    <circle cx="590" cy="175" r="22" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.8">
      <animate attributeName="r" values="20;24;20" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="590" cy="175" r="9" fill="#c4b5fd" opacity="0.25" filter="url(#glow-violet)"/>
    <circle cx="590" cy="175" r="6" fill="#c4b5fd"/>
    <circle cx="590" cy="175" r="2.2" fill="#ffffff"/>
    <text class="label" x="590" y="214" fill="#f1f5f9" font-size="13" text-anchor="middle">Quality Gate</text>
    <text class="hud" x="590" y="230" fill="#c4b5fd" font-size="9" text-anchor="middle">TEST RESULTS</text>
  </g>

  <g>
    <circle cx="730" cy="115" r="18" fill="none" stroke="#34d399" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 730 115" to="360 730 115" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="115" r="8" fill="#34d399" opacity="0.25" filter="url(#glow-green)"/>
    <circle cx="730" cy="115" r="5.5" fill="#34d399"/>
    <circle cx="730" cy="115" r="2" fill="#ffffff"/>
    <text class="label" x="730" y="86" fill="#f1f5f9" font-size="13" text-anchor="middle">Deploy</text>
    <text class="hud" x="730" y="72" fill="#34d399" font-size="9" text-anchor="middle">PASS</text>
  </g>

  <g>
    <circle cx="460" cy="280" r="16" fill="none" stroke="#fb7185" stroke-width="0.9" stroke-dasharray="3 3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 460 280" to="0 460 280" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="460" cy="280" r="7" fill="#fb7185" opacity="0.25" filter="url(#glow-rose)"/>
    <circle cx="460" cy="280" r="5" fill="#fb7185"/>
    <circle cx="460" cy="280" r="2" fill="#ffffff"/>
    <text class="label" x="460" y="312" fill="#f1f5f9" font-size="13" text-anchor="middle">Feedback</text>
    <text class="hud" x="460" y="328" fill="#fb7185" font-size="9" text-anchor="middle">FAIL � VOLTA AO COMMIT</text>
  </g>

  <text class="hud" x="32" y="344" fill="#64748b" font-size="9" letter-spacing="1">SHIFT LEFT � CONTINUOUS TESTING</text>
  <text class="hud" x="818" y="344" fill="#64748b" font-size="9" text-anchor="end" letter-spacing="1">QA GATE ONLINE</text>
</svg>
